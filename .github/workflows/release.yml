name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pull-requests: write

jobs:
  Update-Changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Extract release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update changelog
        run: uv run keepachangelog release ${{ steps.version.outputs.version }}

      - name: Commit changelog
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update changelog for ${{ github.ref_name }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch and open pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="changelog"
          git push origin HEAD:refs/heads/"$branch" --force
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update changelog for ${{ github.ref_name }}" \
            --body "Automated changelog update for release ${{ github.ref_name }}." \
            || echo "PR already exists"
          gh pr merge "$branch" --auto --squash || echo "Could not enable auto-merge"
