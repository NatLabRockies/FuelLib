name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{github.ref}}-${{github.head_ref}}-ci
  cancel-in-progress: true

env:
  UV_VERSION: '0.12.6'
  PYTHON_VERSION: '3.12'

jobs:
  Setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
      - name: Create shared virtual environment
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -e '.[dev]'
      - name: Package environment
        run: tar -czf environment.tar.gz .venv
      - uses: actions/upload-artifact@v4
        with:
          name: uv-environment
          path: environment.tar.gz
          retention-days: 1

  Formatting:
    needs: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uv-environment
      - run: tar -xzf environment.tar.gz
      - run: |
          source .venv/bin/activate
          ruff format --check
          ruff check
          ty check

  Codespell:
    needs: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          name: uv-environment
      - run: tar -xzf environment.tar.gz
      - name: Run codespell
        run: |
          source .venv/bin/activate
          codespell

  Test-Coverage:
    needs: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uv-environment
      - run: tar -xzf environment.tar.gz
      - run: |
          source .venv/bin/activate
          pytest

  Accuracy:
    needs: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uv-environment
      - run: tar -xzf environment.tar.gz
      - run: |
          source .venv/bin/activate
          python tests/test_accuracy.py

  API:
    needs: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uv-environment
      - run: tar -xzf environment.tar.gz
      - run: |
          source .venv/bin/activate
          python tests/test_api.py -v

  Utilities:
    needs: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uv-environment
      - run: tar -xzf environment.tar.gz
      - run: |
          source .venv/bin/activate
          pytest tests/test_cli_utilities.py -v

  Hydrocarbon-Identification:
    needs: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uv-environment
      - run: tar -xzf environment.tar.gz
      - run: |
          source .venv/bin/activate
          pytest tests/test_hc_identification.py -v -s

  Exporting-Scripts:
    needs: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uv-environment
      - run: tar -xzf environment.tar.gz
      - run: |
          source .venv/bin/activate
          python tests/test_exporters.py
  
