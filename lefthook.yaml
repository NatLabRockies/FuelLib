pre-commit:
  parallel: false
  exclude:
    - .venv/
  commands:
    1-fmt:
      run: uv run ruff format

    2-lint:
      run: uv run ruff check --fix

    3-types:
      run: uv run ty check

    4-imports:
      run: uv run lint-imports

    5-docs:
      run: sphinx-build -M html docs/ docs/_build

    6-test:
      run: uv run pytest

    7-check-clean:
      run: git diff --exit-code